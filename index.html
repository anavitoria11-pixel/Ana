<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Places - Map App</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Sidebar -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <h1>My Places</h1>
      <p class="subtitle">Click map, search a place, or upload a photo</p>
    </div>

    <!-- Add Place Methods -->
    <div id="add-methods">
      <div class="add-methods-row">
        <button onclick="showTextSearch()" class="add-btn" title="Search for a place">
          <span class="add-icon">&#128269;</span> Find Place
        </button>
        <button onclick="triggerPhotoUpload()" class="add-btn" title="Scan screenshot for places">
          <span class="add-icon">&#128247;</span> Scan Image
        </button>
      </div>
      <input type="file" id="photo-input" accept="image/*" class="hidden">
    </div>

    <!-- Text Search Panel -->
    <div id="text-search-panel" class="hidden">
      <h3>Find a place</h3>
      <div class="search-row">
        <input type="text" id="geo-search-input" placeholder="e.g. Eiffel Tower, Paris">
        <button onclick="geoSearch()" id="geo-search-btn">Go</button>
      </div>
      <div id="geo-results"></div>
      <button class="secondary small-btn" onclick="closeTextSearch()">Cancel</button>
    </div>

    <!-- Scan Panel - shows OCR results from screenshot -->
    <div id="scan-panel" class="hidden">
      <h3 id="scan-title">Scanning image...</h3>
      <div id="scan-progress" class="scan-progress-bar">
        <div id="scan-progress-fill"></div>
      </div>
      <div id="scan-results" class="hidden">
        <p class="scan-hint">We found text in your image. Edit the search below or tap a detected line to use it:</p>
        <div id="scan-lines"></div>
        <div class="search-row">
          <input type="text" id="scan-search-input" placeholder="Place name to search...">
          <button onclick="scanGeoSearch()">Find</button>
        </div>
        <div id="scan-geo-results"></div>
      </div>
      <button class="secondary small-btn" onclick="closeScanPanel()">Cancel</button>
    </div>

    <!-- Save Form -->
    <div id="place-form" class="hidden">
      <h3 id="form-title">Save this place</h3>
      <div id="form-location-preview" class="hidden">
        <span id="form-location-name"></span>
      </div>
      <div class="form-group">
        <label for="place-name">Name</label>
        <input type="text" id="place-name" placeholder="e.g. Favorite coffee shop">
      </div>
      <div class="form-group">
        <label for="place-desc">Description</label>
        <textarea id="place-desc" rows="2" placeholder="Add a note about this place..."></textarea>
      </div>
      <div class="form-group">
        <label for="place-category">Category</label>
        <select id="place-category">
          <option value="default">General</option>
          <option value="food">Food & Drink</option>
          <option value="shop">Shopping</option>
          <option value="nature">Nature</option>
          <option value="work">Work</option>
          <option value="home">Home</option>
        </select>
      </div>
      <div class="form-group">
        <label for="place-tags">Tags</label>
        <input type="text" id="place-tags" placeholder="e.g. restaurant, italian, cozy (comma separated)">
      </div>
      <div class="form-actions">
        <button id="btn-save" onclick="savePlace()">Save Place</button>
        <button id="btn-cancel" class="secondary" onclick="cancelForm()">Cancel</button>
      </div>
    </div>

    <!-- Filter bar -->
    <div id="filter-bar">
      <input type="text" id="search-input" placeholder="Search saved places...">
      <div id="tag-filters"></div>
    </div>

    <!-- Places list grouped by city -->
    <div id="places-list">
      <p id="empty-message" class="empty-msg">No saved places yet.<br>Click the map, search a place, or upload a photo!</p>
    </div>

    <div class="sidebar-footer">
      <button class="secondary" onclick="exportPlaces()">Export JSON</button>
      <button class="secondary" onclick="clearAllPlaces()">Clear All</button>
    </div>
  </aside>

  <!-- Map -->
  <div id="map"></div>

  <!-- Mobile toggle -->
  <button id="sidebar-toggle" onclick="toggleSidebar()">&#9776;</button>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
